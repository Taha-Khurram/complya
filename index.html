<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Complya Test Reports</title>
  <style>
    :root { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --card: #f6f8fa; --border: #d1d9e0; --link: #0969da; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --card: #151b23; --border: #3d444d; --link: #4493f8; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    p { margin: 0 0 24px; color: var(--muted); }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    a { display: block; padding: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--link); text-decoration: none; font-weight: 600; }
    a:hover { border-color: var(--link); }
    span { display: block; color: var(--muted); font-weight: 400; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Complya Test Reports</h1>
    <p>Allure reports published by GitHub Actions.</p>
    <ul>
      <li><a href="./home/">Home (E2E Tests)<span>tests/home</span></a></li>
      <li><a href="./login/">Login (E2E Tests)<span>tests/login</span></a></li>
      <li><a href="./signup/">Signup (E2E Tests)<span>tests/signup</span></a></li>
      <li><a href="./onboarding/">Onboarding (E2E Tests)<span>tests/onboarding</span></a></li>
    </ul>
  </main>
</body>
</html>
