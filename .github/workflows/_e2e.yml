name: E2E (reusable)

on:
  workflow_call:
    inputs:
      suite:
        description: Folder name on GitHub Pages (e.g. staging, home)
        required: true
        type: string
      test-path:
        description: Path passed to Playwright (e.g. tests/home). Empty runs everything.
        required: false
        type: string
        default: ''
      report-name:
        description: Title shown in the Allure report
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 60
    env:
      MAILSLURP_API_KEY: ${{ secrets.MAILSLURP_API_KEY }}
      LT_USERNAME: ${{ secrets.LT_USERNAME }}
      LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
      TEST_PATH: ${{ inputs.test-path }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test -- $TEST_PATH

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ inputs.suite }}
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ inputs.suite }}
          path: allure-results/
          retention-days: 14

  publish:
    needs: test
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    env:
      SUITE: ${{ inputs.suite }}
      REPORT_NAME: ${{ inputs.report-name }}
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-${{ inputs.suite }}
          path: allure-results

      - name: Fetch previous history
        run: |
          mkdir -p history
          if curl -sfL "$PAGES_URL/$SUITE/history/history.jsonl" -o history/full.jsonl; then
            tail -n 19 history/full.jsonl > history/history.jsonl
          fi
          rm -f history/full.jsonl

      - name: Generate Allure report
        run: npx allure awesome ./allure-results --output "site/$SUITE" --report-name "$REPORT_NAME" --history-path history/history.jsonl

      - name: Prepare site
        run: |
          mkdir -p "site/$SUITE/history"
          cp history/history.jsonl "site/$SUITE/history/"
          cp .github/pages/index.html site/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          keep_files: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "Publish ${{ inputs.suite }} Allure report"
