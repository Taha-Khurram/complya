name: Staging (E2E Tests)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    uses: ./.github/workflows/_e2e.yml
    with:
      suite: staging
      test-path: ''
      report-name: Staging (E2E Tests)
    secrets: inherit
